[metadata]
name = "git-worktrees"
description = "Browse Git worktrees (use tv-worktree in Fish to cd)"
requirements = ["git", "python3"]

[source]
command = 'python3 "$HOME/.config/television/tv-helper.py" worktree-list'
display = '{split:\t:1}'
# Return an opaque token; tv-worktree decodes it without eval.
output = '{split:\t:0}'

[preview]
command = 'python3 "$HOME/.config/television/tv-helper.py" worktree-preview {split:\t:0}'
