[metadata]
name = "launchd-services"
description = "Manage current-user GUI services; changes require confirmation"
requirements = ["launchctl", "python3"]

[source]
command = 'python3 "$HOME/.config/television/tv-helper.py" service-list'
display = '{split:\t:1}'
# Opaque selection token; never emit a lossy/shell-interpreted path or label.
output = '{split:\t:0}'

[preview]
command = 'python3 "$HOME/.config/television/tv-helper.py" service-preview {split:\t:0}'

[ui]
layout = "portrait"

[keybindings]
alt-s = "actions:start"
alt-k = "actions:stop"
alt-r = "actions:restart"
alt-e = "actions:enable"
alt-d = "actions:disable"
ctrl-f = "actions:plist"

[actions.start]
description = "Start service (confirmation required)"
command = 'python3 "$HOME/.config/television/tv-helper.py" service-start {split:\t:0}'
mode = "execute"

[actions.stop]
description = "Send SIGTERM; KeepAlive may restart it (confirmation required)"
command = 'python3 "$HOME/.config/television/tv-helper.py" service-stop {split:\t:0}'
mode = "execute"

[actions.restart]
description = "Kill and restart service (confirmation required)"
command = 'python3 "$HOME/.config/television/tv-helper.py" service-restart {split:\t:0}'
mode = "execute"

[actions.enable]
description = "Enable; does not start service (confirmation required)"
command = 'python3 "$HOME/.config/television/tv-helper.py" service-enable {split:\t:0}'
mode = "execute"

[actions.disable]
description = "Disable; does not stop running process (confirmation required)"
command = 'python3 "$HOME/.config/television/tv-helper.py" service-disable {split:\t:0}'
mode = "execute"

[actions.plist]
description = "Edit plist; Nix-managed plists must be changed in Nix"
command = 'python3 "$HOME/.config/television/tv-helper.py" service-plist {split:\t:0}'
mode = "execute"
