[metadata]
name = "git-changed-files"
description = "Browse changed files safely; restore requires confirmation"
requirements = ["git", "python3"]

[source]
command = 'python3 "$HOME/.config/television/tv-helper.py" changed-list'
display = '{split:\t:1}'
# Opaque selection token; never emit a lossy/shell-interpreted path or label.
output = '{split:\t:0}'

[preview]
command = 'python3 "$HOME/.config/television/tv-helper.py" changed-preview {split:\t:0}'

[keybindings]
ctrl-e = "actions:edit"
ctrl-o = "actions:open-shell"
alt-r = "actions:restore"

[actions.edit]
description = "Edit the existing file (EDITOR, default nvim)"
command = 'python3 "$HOME/.config/television/tv-helper.py" changed-edit {split:\t:0}'
mode = "execute"

[actions.open-shell]
description = "Open a child shell in the file directory"
command = 'python3 "$HOME/.config/television/tv-helper.py" changed-shell {split:\t:0}'
mode = "execute"

[actions.restore]
description = "Discard unstaged changes (type RESTORE to confirm)"
command = 'python3 "$HOME/.config/television/tv-helper.py" changed-restore {split:\t:0}'
mode = "execute"
