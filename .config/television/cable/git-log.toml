[metadata]
name = "git-log"
description = "Browse commits; mutations require confirmation"
requirements = ["git", "python3"]

[source]
command = 'python3 "$HOME/.config/television/tv-helper.py" log-list'
display = '{split:\t:1}'
output = '{split:\t:0}'
no_sort = true
frecency = false

[preview]
command = 'python3 "$HOME/.config/television/tv-helper.py" log-preview {split:\t:0}'

[keybindings]
ctrl-c = "quit"
ctrl-y = "actions:copy"
alt-p = "actions:cherry-pick"
alt-o = "actions:checkout"

[actions.copy]
description = "Copy full commit hash to system clipboard"
command = 'python3 "$HOME/.config/television/tv-helper.py" log-copy {split:\t:0}'
mode = "execute"

[actions.checkout]
description = "Checkout detached HEAD (type CHECKOUT to confirm)"
command = 'python3 "$HOME/.config/television/tv-helper.py" log-checkout {split:\t:0}'
mode = "execute"

[actions.cherry-pick]
description = "Cherry-pick commit (type CHERRY-PICK to confirm)"
command = 'python3 "$HOME/.config/television/tv-helper.py" log-cherry-pick {split:\t:0}'
mode = "execute"
